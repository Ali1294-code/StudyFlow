<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="StudyFlow is a modern student productivity dashboard designed to help university students organize their courses, tasks, schedules, and study progress."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- temp -->
    <link rel="icon" href="imgs/Logo/tapWebLogo.svg" />

    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/queries.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>StudyFlow &mdash; Study never be hard more</title>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <main class="main grid grid--2-column">
      <aside class="main-aside">
        <div class="aside-header">
          <a href="#">
            <img class="logo" src="imgs/Logo/logo.svg" alt="logo" />
            <h1 class="title">StudyFlow</h1>
          </a>
        </div>

        <nav class="main-nav">
          <ul class="main-nav-list">
            <li>
              <a href="#" class="main-nav-link selected">
                <ion-icon
                  class="nav-icon selected-icon"
                  name="easel-outline"
                ></ion-icon>
                <span>Dashboard</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link non-selected">
                <ion-icon class="nav-icon" name="library-outline"></ion-icon>
                <span>Courses</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link non-selected">
                <ion-icon
                  class="nav-icon"
                  name="checkmark-circle-outline"
                ></ion-icon>
                <span>Tasks</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link non-selected">
                <ion-icon
                  class="nav-icon"
                  name="calendar-number-outline"
                ></ion-icon>
                <span>Schedule</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link non-selected">
                <ion-icon class="nav-icon" name="bar-chart-outline"></ion-icon>
                <span>Progress</span></a
              >
            </li>

            <li>
              <button class="profile-box">
                <img
                  class="profile-img"
                  src="imgs/Profile/profilePhoto.webp"
                  alt="profile image"
                />
                <div class="profile-info">
                  <h3 class="secondary-heading user-name">Ali</h3>
                  <p class="profile-major">Computer Science Student</p>
                </div>
              </button>
            </li>
          </ul>
        </nav>
      </aside>

      <div class="dashboard-box grid grid--2-row">
        <header class="dashboard-header">
          <div class="date">date</div>
          <div class="header-actions">Header Actions</div>
        </header>

        <section class="dashboard-section">Dashboard</section>
      </div>
    </main>
  </body>
</html>
