<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="StudyFlow is a modern student productivity dashboard designed to help university students organize their courses, tasks, schedules, and study progress."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="imgs/Logo/tapWebLogo.svg" />
    <!-- temp -->
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/queries.css" />

    <title>StudyFlow &mdash; Study never be hard more</title>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <main class="main grid grid--2-column">
      <aside class="main-aside">
        <div class="aside-header">
          <a href="#">
            <img class="logo" src="imgs/Logo/logo.svg" alt="logo" />
            <h1 class="title">StudyFlow</h1>
          </a>
        </div>

        <nav class="main-nav">
          <ul class="main-nav-list">
            <li>
              <a href="#" class="main-nav-link">
                <ion-icon class="nav-icon" name="easel-outline"></ion-icon>
                <span>Dashboard</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link">
                <ion-icon class="nav-icon" name="library-outline"></ion-icon>
                <span>Courses</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link">
                <ion-icon
                  class="nav-icon"
                  name="checkmark-circle-outline"
                ></ion-icon>
                <span>Tasks</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link">
                <ion-icon
                  class="nav-icon"
                  name="calendar-number-outline"
                ></ion-icon>
                <span>Schedule</span></a
              >
            </li>

            <li>
              <a href="#" class="main-nav-link">
                <ion-icon class="nav-icon" name="bar-chart-outline"></ion-icon>
                <span>Progress</span></a
              >
            </li>

            <li>
              <img
                class="profile-img"
                src="imgs/Profile/profilePhoto.webp"
                alt="profile image"
              />
              <div class="profile-info">
                <h2 class="secondary-heading">Ali</h2>
                <p class="profile-major">Computer Science Student</p>
              </div>
            </li>
          </ul>
        </nav>
      </aside>

      <div class="dashboard-box grid grid--2-row">
        <header class="dashboard-header">Dashboard Header</header>

        <div class="dashboard">Dashboard</div>
      </div>
    </main>
  </body>
</html>
